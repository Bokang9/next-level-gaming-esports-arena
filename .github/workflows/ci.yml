name: Esports arena CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test if exists
        run: npm test -- --watchAll=false || echo "No tests yet - skipping"
      - name: Build if exists
        run: |
          if grep -q '"build"' package.json; then npm run build; else echo "No build script - skipping"; fi
